<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexusAcademyLS - Coaching Center Academic & e-Learning Portal (UCAM & ELMS)</title>
  <link rel="icon" type="image/png" href="/assets/logo.png">
  
  <!-- Google Fonts: Plus Jakarta Sans & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN with dark mode support -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              navy: '#1f1b63',
              dark: '#151246',
              light: '#2e268f',
              accent: '#3b82f6',
              gold: '#f59e0b',
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            outfit: ['"Outfit"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Immediate Dark Mode initialization to avoid theme flash -->
  <script>
    (function() {
      try {
        const savedTheme = localStorage.getItem('nexus_theme');
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    })();
  </script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 antialiased selection:bg-indigo-900 selection:text-white transition-colors duration-200">

  <!-- Root mount point for the application -->
  <div id="app-root"></div>

  <!-- Scripts -->
  <script src="/js/api.js"></script>
  <script src="/js/elms.js"></script>
  <script src="/js/ucam.js"></script>
  <script src="/js/messaging.js"></script>
  <script src="/js/notices.js"></script>
  <script src="/js/admin.js"></script>
  <script src="/js/app.js"></script>

  <!-- Printable Print Styles -->
  <style>
    @media print {
      header, footer, nav, button, select, #toast-container, .modal-overlay, #admin-sub-content select {
        display: none !important;
      }
      body {
        background: #ffffff !important;
        color: #000000 !important;
      }
      .nexus-card {
        box-shadow: none !important;
        border: 1px solid #ccc !important;
      }
      #ucam-content-area {
        display: block !important;
      }
      .view-panel {
        display: block !important;
      }
    }
  </style>
</body>
</html>
